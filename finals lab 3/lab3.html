<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid Laboratory</title>
    <link rel="stylesheet" href="style.css">
<style>
 * {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sens-serif;
    background-color: #C4C4C4;
    
}

.page{
    min-height: 100vh;
    
}

.page {
     min-height: 100vh;
    display: grid;
    grid-template-areas:
     "header header"
     "sidebar main"
     "footer footer";
    grid-template-columns: 250px 1fr;
    grid-template-rows: auto 1fr auto;
}

.header {
    grid-area: header;
}

.sidebar {
    grid-area: sidebar;
}

.main {
    grid-area: main;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 24px;
    background-color: #8b0c0c;
    color: rgb(0, 255, 179);
}

.logo {
    font-weight: bold;
    font-size: 20px;
}

.navbar {
    display: flex;
    gap: 18px;
    text-align: center;
}

.navbar a {
    color: rgb(255, 255, 255);
    text-decoration: double;
    text-align: center;
}

.sidebar {
    grid-area: sidebar;
    padding: 24px;
    background-color: #4e8188;
    border-right: 1px solid rgba(0, 0, 0, 0.151);
}

.main {
    grid-area: main;
    padding: 24px;
}

.footer {
    grid-area: footer;
    padding: 16px;
    text-align: center;
    background-color: rgba(202, 12, 12, 0);
    color: rgb(30, 32, 36);
}

.card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    margin-top: 20px;
}

.card {
    min-height: 120px;
    padding: 20px;
    background-color: #ad9898;
    border: 1px solid #ff080869;
    border-radius: 10px;
    box-shadow: 0 2px 6px rgba(64, 85, 75, 0.37);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    text-align: center;
}

@media (max-width: 768px) {
    .page {
        grid-template-areas: 
        "header"
        "sidebar"
        "main" 
        "footer" ;
        grid-template-columns: 1fr;
    }

    .header {
        flex-direction: column;
        gap: 12px;
    }

    .navbar{
        flex-wrap: wrap;
        justify-content: center;
    }
}
</style>

</head>
<body>
    <div class="page">
        <header class="header">
            <div class="logo">Student Portal</div>
            <nav class="navbar">
                <a href="#">Home</a>
                <a href="#">Courses</a>
                <a href="#">Grades</a>
                <a href="#">Contact</a>
            </nav>
        </header>

        <aside class="sidebar">
            <h2>Menu</h2>
            <p>Dashboard</p>
            <p>Class Schedule</p>
            <p>Announcements</p>
        </aside>

        <main class="main">
            <h1>My Courses</h1>
            <section class="card-grid">
                <article class="card">HTML Basics</article>
                <article class="card">CSS Fundamentals</article>
                <article class="card">CSS Grid</article>
                <article class="card">JavaScript</article>
                <article class="card">Web Design</article>
                <article class="card">Final Project</article>
            </section>
        </main>

        <footer class="footer">
            <p>CSS Grid Laboratory Activity</p>
        </footer>
    </div>
{ 
    box-sizing: border-box;
}
body {
    margin: 0;
    font-familt: Arial, sans-serif;
    backgroung
}


</body>
</html>
